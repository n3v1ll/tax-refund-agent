name: Update RBA exchange rates
on:
  schedule:
    - cron: '0 22 * * 1'  # Tuesdays 8-9am Sydney
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fx:update
      - name: Open a PR if rates changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- web/public/fx; then echo "No change"; exit 0; fi
          branch=fx/update-$(date +%Y%m%d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add web/public/fx
          git commit -m "Update RBA exchange rates"
          git push -u origin "$branch"
          gh pr create --title "Update RBA exchange rates" --body "Automated weekly refresh of RBA F11.1 rates." || true
